name: E2E

on:
  pull_request:
  push:
    branches:
      - master
      - dev
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e (admin)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # These need to be set at job level, not just on the build step: the
      # webServer Playwright starts (`next start`) is a separate step/process
      # and reads them at request time too, not just at build time. No
      # credential shapes on purpose (no user:pass@host URL) - never
      # connected to, but secret scanners pattern-match on shape alone.
      DATABASE_URL: https://ci-stub.invalid/not-a-real-database
      DATABASE_URL_UNPOOLED: https://ci-stub.invalid/not-a-real-database
      BETTER_AUTH_SECRET: not-a-real-credential-ci-e2e-only-placeholder
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      # No database here on purpose (no service container, no DATABASE_URL).
      # Today's smoke tests never need one: the login page is a pure client
      # render, and the auth middleware short-circuits to a redirect on a
      # missing session cookie before it would query anything. When a real
      # DB-dependent e2e test is added, this needs two things db-validate in
      # ci.yml also had to work around: a postgres:16 service container loaded
      # with packages/db/ci/baseline-auth.sql (real databases already have the
      # better-auth tables outside drizzle-kit's tracked migrations - see the
      # comment in ci.yml's db-validate job), and either a fix for migration
      # 0035 (uses an enum value added in 0005, in the same transaction when
      # applying from scratch - fine incrementally, broken applying all 45
      # migrations at once) or some other way to reach a fully-migrated state.
      # apps/admin's runtime DB access also goes through
      # @neondatabase/serverless's WebSocket driver, which needs a real Neon
      # endpoint or a neon-local proxy - a plain Postgres container isn't
      # enough on its own.
      - name: Install Playwright (Chromium only)
        run: bunx playwright install --with-deps chromium
        working-directory: apps/admin

      - name: Build admin
        run: bun run build
        working-directory: apps/admin

      - name: Run E2E tests
        run: bunx playwright test
        working-directory: apps/admin

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/admin/playwright-report/
          retention-days: 7
