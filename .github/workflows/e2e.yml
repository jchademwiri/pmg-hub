name: E2E

on:
  pull_request:
  push:
    branches:
      - master
      - dev
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e (admin)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pmghub_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/pmghub_test_db
      DATABASE_URL_UNPOOLED: postgres://postgres:postgres@localhost:5432/pmghub_test_db
      BETTER_AUTH_SECRET: e2e-stub-secret-not-a-real-credential-0
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      # Same fixture db-validate uses in ci.yml: real databases already have
      # the better-auth tables outside of drizzle-kit's tracked migrations,
      # so a truly empty DB needs this baseline before the tracked migrations
      # (which reference "user" via foreign keys) can apply.
      #
      # NOTE: apps/admin's runtime DB access (getDb()) goes through
      # @neondatabase/serverless's WebSocket driver, which can't actually
      # reach this plain Postgres container - only a real Neon endpoint or a
      # neon-local proxy. Today's smoke tests never hit that path (the login
      # page is a pure client render, and the middleware short-circuits to a
      # redirect on a missing session cookie before it would query the DB),
      # so this is safe for now. Any future e2e test that needs a real DB
      # round-trip will need a neon-local (or similar) proxy added here.
      - name: Load auth baseline fixture
        run: psql "$DATABASE_URL_UNPOOLED" -f ci/baseline-auth.sql
        working-directory: packages/db

      - name: Run DB migrations
        run: bun src/migrate.ts
        working-directory: packages/db

      - name: Install Playwright (Chromium only)
        run: bunx playwright install --with-deps chromium
        working-directory: apps/admin

      - name: Build admin
        run: bun run build
        working-directory: apps/admin

      - name: Run E2E tests
        run: bunx playwright test
        working-directory: apps/admin

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/admin/playwright-report/
          retention-days: 7
