name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - dev

# Cancel superseded runs on the same PR/branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.3.14

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bunx prettier --check .

  check-types:
    name: Check types
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install

      - name: Check types
        run: bun run check-types

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install

      - name: Test
        run: bun run test

  db-migrate-check:
    name: DB schema + migration check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # NOTE: this only runs `drizzle-kit check` (validates the migrations folder's
    # internal consistency - no live DB needed). It intentionally does NOT run
    # migrate.ts against a fresh database: the better-auth tables (user, session,
    # account, verification - see packages/db/src/schema/auth.ts) were never
    # captured as a migration, so migrate.ts can only ever run against a database
    # that already has a baseline schema (see the "baseline detection" comment at
    # the top of packages/db/src/migrate.ts). A truly empty DB will always fail
    # on the first FK reference to "user". That's a pre-existing gap, not
    # something this workflow works around.
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install

      - name: Drizzle schema check
        run: bunx drizzle-kit check
        working-directory: packages/db

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [check-types, test, db-migrate-check]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED_STAGING }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED_STAGING }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          PMG_RESEND_API_KEY: ${{ secrets.PMG_RESEND_API_KEY }}
          TES_RESEND_API_KEY: ${{ secrets.TES_RESEND_API_KEY }}
          AWS_RESEND_API_KEY: ${{ secrets.AWS_RESEND_API_KEY }}
          TES_FROM_EMAIL: ${{ secrets.TES_FROM_EMAIL }}
          TES_ADMIN_EMAIL: ${{ secrets.TES_ADMIN_EMAIL }}
          AWS_FROM_EMAIL: ${{ secrets.AWS_FROM_EMAIL }}
          AWS_ADMIN_EMAIL: ${{ secrets.AWS_ADMIN_EMAIL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
          CLOUDFLARE_R2_BACKUP_PREFIX: ${{ secrets.CLOUDFLARE_R2_BACKUP_PREFIX }}
          CLOUDFLARE_R2_BACKUP_RETENTION_DAYS: ${{ secrets.CLOUDFLARE_R2_BACKUP_RETENTION_DAYS }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          QSTASH_TOKEN: ${{ secrets.QSTASH_TOKEN }}
          QSTASH_CURRENT_SIGNING_KEY: ${{ secrets.QSTASH_CURRENT_SIGNING_KEY }}
          QSTASH_NEXT_SIGNING_KEY: ${{ secrets.QSTASH_NEXT_SIGNING_KEY }}
